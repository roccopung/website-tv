<!doctype html>
<meta charset="utf-8">
<title>Old TV</title>
<style>
  body { margin: 0; background: #000; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #tube, #out { object-fit: fill; filter: url(#crt-gamma); }
  #scanlines { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(transparent 50%, rgb(0 0 0 / var(--depth)) 50%) 0 0 / 100% var(--pitch); }
  .ui { position: fixed; bottom: 16px; left: 16px; right: 16px; display: flex; gap: 8px; }
  #seek { flex: 1; }
  label { color: #fff; font: 13px system-ui; display: flex; align-items: center; gap: 4px; }
</style>

<video id="v0" muted loop playsinline></video>
<video id="v1" muted loop playsinline></video>
<canvas id="tube"></canvas>
<canvas id="out" hidden></canvas>
<div id="scanlines" hidden></div>
<svg width="0" height="0" style="position: absolute">
  <filter id="crt-gamma" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="gamma" /><feFuncG type="gamma" /><feFuncB type="gamma" />
    </feComponentTransfer>
  </filter>
</svg>
<div class="ui">
  <select id="pick"></select>
  <select id="lines" aria-label="Scanlines"><option>no lines</option><option>fixed lines</option><option>beam lines</option></select>
  <label><input id="lowres" type="checkbox" checked>Low res</label>
  <input id="seek" type="range" min="0" max="1" step="any" value="0" aria-label="Timeline">
</div>

<script type="module">
  import { TRANSITIONS } from './transitions.js';

  const LINE_CSS_PX = 2.5;
  const FIELD_RATE = 60; // NTSC
  const FREEZE_MS = 100;
  const MASK_SCALE = 1 / 4;
  const MASK_PAD = 20;
  const SOFTNESS = 0.025;
  const H_SAMPLES = 480;
  const CRT_GAMMA = 2.4 / 2.2;
  const BLOOM_THRESHOLD = 0.35;
  const BLOOM_RADIUS = 2.8;
  const BLOOM_STRENGTH = 0.25;
  const SCAN_DEPTH = 0.5;
  const BEAM_BLUR = 0.4;
  const CHROMA_RATIO = 1.3 / 4.2; // NTSC chroma (I) vs luma bandwidth, MHz

  const FILES = [
    'storm.mp4', 'perfect-days.mp4'
    // 'PrivateL1947.mp4', 'Sleepfor1950.mp4', 'SocialSe1953.mp4', 'SpotNews1937.mp4',
    // 'Survival1951.mp4', 'Usingthe1947.mp4', 'WartimeN1943.mp4', 'stripper_1.mp4',
    // 'stripper_betty_rowland.mp4', 'stripper_variety_girls.mp4', 'tmp_50168.mp4',
  ];

  const $ = id => document.getElementById(id);
  const tube = $('tube'), pick = $('pick'), seek = $('seek'), lowres = $('lowres'), lines = $('lines'), out = $('out'), scanlines = $('scanlines'), vids = [$('v0'), $('v1')];
  const offscreen = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
  const ctx = tube.getContext('2d'), octx = out.getContext('2d');
  const [frame, fctx] = offscreen();
  const [layer, lctx] = offscreen();
  const [mask, mctx] = offscreen();
  const [glow, gctx] = offscreen();
  const [chroma, cctx] = offscreen();
  const [gaps, pctx] = offscreen();

  document.querySelectorAll('#crt-gamma [type="gamma"]').forEach(f => f.setAttribute('exponent', CRT_GAMMA));

  let w, h, cssH;
  const fit = () => {
    const low = lowres.checked;
    const linePx = low ? Math.max(1, Math.round(LINE_CSS_PX * devicePixelRatio)) : 1;
    h = Math.ceil(innerHeight * devicePixelRatio / linePx);
    cssH = h * linePx / devicePixelRatio;
    w = low ? Math.round(H_SAMPLES * innerWidth / (cssH * 4 / 3)) : Math.round(innerWidth * devicePixelRatio);
    tube.style.height = out.style.height = scanlines.style.height = cssH + 'px';
    out.width = Math.round(innerWidth * devicePixelRatio);
    out.height = Math.round(cssH * devicePixelRatio);
    const pitch = Math.max(2, Math.round(LINE_CSS_PX * devicePixelRatio));
    scanlines.style.setProperty('--pitch', pitch / devicePixelRatio + 'px');
    scanlines.style.setProperty('--depth', SCAN_DEPTH);
    gaps.width = 1;
    gaps.height = pitch;
    for (let y = 0; y < pitch; y++) {
      const v = 255 * (1 - SCAN_DEPTH * (1 - Math.sin(Math.PI * y / pitch)));
      pctx.fillStyle = `rgb(${v} ${v} ${v})`;
      pctx.fillRect(0, y, 1, 1);
    }
    for (const c of [tube, frame, layer, glow]) { c.width = w; c.height = h; }
    chroma.width = Math.max(1, Math.round(w * CHROMA_RATIO));
    chroma.height = h;
    for (const c of [fctx, lctx, cctx]) c.imageSmoothingQuality = 'high';
    mask.width = Math.ceil(innerWidth * MASK_SCALE) + 2 * MASK_PAD;
    mask.height = Math.ceil(cssH * MASK_SCALE) + 2 * MASK_PAD;
  };
  fit();
  addEventListener('resize', fit);
  lowres.onchange = fit;
  lines.onchange = () => {
    scanlines.hidden = lines.selectedIndex !== 1;
    out.hidden = lines.selectedIndex !== 2;
    tube.hidden = !out.hidden;
  };

  // playback

  let cur = 0, idx = 0;
  const load = (v, i) => { v.src = 'files/' + FILES[i]; v.play(); };

  pick.innerHTML = FILES.map(f => `<option>${f}</option>`).join('');
  pick.onchange = () => load(vids[cur], idx = pick.selectedIndex);
  load(vids[cur], 0);

  seek.oninput = () => vids[cur].currentTime = seek.value * vids[cur].duration;

  const unmute = () => vids[cur].muted = false;
  addEventListener('pointerdown', unmute, { once: true });
  addEventListener('keydown', unmute, { once: true });

  // freeze

  let drawn = 0, frozen = null, release;
  tube.onclick = out.onclick = () => {
    frozen = drawn % 2;
    clearTimeout(release);
    release = setTimeout(() => frozen = null, FREEZE_MS);
  };

  // transitions

  const names = Object.keys(TRANSITIONS);
  let trans = null, lastName = null;

  const randomTransition = () => {
    const pool = names.filter(n => n !== lastName);
    return lastName = pool[Math.floor(Math.random() * pool.length)];
  };

  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (trans) return;
    trans = { start: null, ...TRANSITIONS[randomTransition()] };
    const next = vids[1 - cur];
    load(next, idx = (idx + 1) % FILES.length);
    pick.selectedIndex = idx;
    next.addEventListener('playing', () => trans.start = performance.now(), { once: true });
  });

  const drawMask = p => {
    const W = mask.width, H = mask.height;
    mctx.clearRect(0, 0, W, H);
    mctx.filter = `blur(${W * SOFTNESS}px)`;
    mctx.beginPath();
    trans.shape(mctx, W, H, p);
    mctx.fill();
    return mask;
  };

  // render

  const cover = (c, v) => {
    const k = Math.max(innerWidth / v.videoWidth, cssH / v.videoHeight);
    const dw = v.videoWidth * k * w / innerWidth, dh = v.videoHeight * k * h / cssH;
    c.drawImage(v, (w - dw) / 2, (h - dh) / 2, dw, dh);
  };

  const crossfadeAudio = p => {
    const [from, to] = [vids[cur], vids[1 - cur]];
    to.muted = from.muted;
    from.volume = Math.cos(p * Math.PI / 2);
    to.volume = Math.sin(p * Math.PI / 2);
  };

  const compose = t => {
    cover(fctx, vids[cur]);
    if (!trans?.start) return;
    const p = Math.min((t - trans.start) / trans.ms, 1);
    cover(lctx, vids[1 - cur]);
    lctx.globalCompositeOperation = 'destination-in';
    lctx.drawImage(drawMask(p), MASK_PAD, MASK_PAD, mask.width - 2 * MASK_PAD, mask.height - 2 * MASK_PAD, 0, 0, w, h);
    lctx.globalCompositeOperation = 'source-over';
    fctx.drawImage(layer, 0, 0);
    crossfadeAudio(p);
    if (p === 1) {
      vids[cur].pause();
      vids[cur].muted = true;
      vids[cur].volume = 1;
      cur = 1 - cur;
      trans = null;
    }
  };

  const bleedChroma = () => {
    cctx.drawImage(frame, 0, 0, chroma.width, h);
    fctx.save();
    fctx.globalCompositeOperation = 'color';
    fctx.drawImage(chroma, 0, 0, w, h);
    fctx.restore();
  };

  const bloom = (c, W, H) => {
    gctx.clearRect(0, 0, w, h);
    gctx.filter = `contrast(${0.5 / (0.5 - BLOOM_THRESHOLD)}) blur(${BLOOM_RADIUS}px)`;
    gctx.drawImage(frame, 0, 0);
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = BLOOM_STRENGTH;
    c.drawImage(glow, 0, 0, W, H);
    c.restore();
  };

  const drawBeam = () => {
    const W = out.width, H = out.height;
    octx.save();
    octx.filter = `blur(${BEAM_BLUR * gaps.height}px)`;
    octx.drawImage(tube, 0, 0, W, H);
    octx.restore();
    octx.save();
    octx.globalCompositeOperation = 'multiply';
    octx.fillStyle = octx.createPattern(gaps, 'repeat');
    octx.fillRect(0, 0, W, H);
    octx.restore();
    bloom(octx, W, H);
  };

  const drawField = field => {
    ctx.save();
    ctx.beginPath();
    for (let y = field % 2; y < h; y += 2) ctx.rect(0, y, w, 1);
    ctx.clip();
    ctx.drawImage(frame, 0, 0);
    ctx.restore();
  };

  let last = -1;
  (function tick(t = 0) {
    const field = Math.floor(t * FIELD_RATE / 1000);
    if (field !== last && vids[cur].videoWidth && field % 2 !== frozen) {
      last = drawn = field;
      compose(t);
      bleedChroma();
      const beam = !out.hidden;
      if (!beam) bloom(fctx, w, h);
      drawField(field);
      if (beam) drawBeam();
      if (!seek.matches(':active')) seek.value = vids[cur].currentTime / vids[cur].duration;
    }
    requestAnimationFrame(tick);
  })();
</script>
